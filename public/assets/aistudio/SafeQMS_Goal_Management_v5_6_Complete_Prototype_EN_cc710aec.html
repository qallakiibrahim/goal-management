function matrix(){

`<div class="hierarchy-bar">${btn('Visual X-Matrix',"setMatrixView('visual')",S.matrixView==='visual'?'teal':'')}${btn('Detailed relationship tables',"setMatrixView('tables')",S.matrixView==='tables'?'teal':'')}</div>${S.matrixView==='visual'?visualXMatrix():''}<div class="banner">Click a correlation cell to cycle through <b>No link → Supporting → Strong → No link</b>. Every change updates the shared relationship model; it does not create duplicate goals or initiatives.</div>
<div class="grid2">${panel('Strategic logic',`<div class="flow"><div class="step">Breakthrough goals</div>→<div class="step">Annual objectives</div>→<div class="step active">Initiatives</div>→<div class="step">KPIs</div></div><p class="small muted" style="margin-top:12px">A readable X-Matrix relationship editor is shown below. The Strategy A3 provides the compact printable layout.</p>`)}
${panel('Alignment validation',`<div class="minirow">✓ ${S.goals.filter(g=>visibleToRole(g)&&g.kpi).length} goals have a KPI</div><div class="minirow">✓ ${S.initiatives.filter(i=>visibleInitiative(i)&&S.relations.some(r=>r.to===i.id)).length} initiatives linked to goals</div><div class="minirow">⚠ ${S.goals.filter(g=>visibleToRole(g)&&g.level!=='Organization'&&!S.relations.some(r=>r.from===g.id&&r.to.startsWith('I-'))).length} objectives lack directly linked initiatives</div><div class="minirow">◷ ${S.approvals.filter(a=>a.status==='Pending').length} pending approval(s)</div>`)}</div>
${S.matrixView==='tables'?panel('Annual Objectives × Improvement Initiatives',`<div class="matrixwrap"><table class="matrix"><thead><tr><th class="corner">Goal / Initiative</th>${top}</tr></thead><tbody>${rows}</tbody></table></div><p class="xs muted">● Strong relationship &nbsp; ◌ Supporting relationship &nbsp; – No relationship</p>`)+panel('Improvement Initiatives × KPIs',`<div class="matrixwrap"><table class="matrix"><thead><tr><th class="corner">Initiative / KPI</th>${S.kpis.map(k=>`<th>${esc(k.name)}</th>`).join('')}</tr></thead><tbody>${rows2}</tbody></table></div>`) :''}`;
}
function matrixCell(a,b){let r=S.relations.find(x=>x.from===a&&x.to===b),n=r?.strength||0;return `<td><button ${roleCan('matrixEdit',{from:a,to:b})?'':'disabled'} class="cell ${n===2?'strong':n===1?'support':''}" title="${a} → ${b}" onclick="cycleLink('${a}','${b}')">${n===2?'●':n===1?'◌':'–'}</button></td>`}
function cycleLink(a,b){let r=S.relations.find(x=>x.from===a&&x.to===b);if(!r)S.relations.push({from:a,to:b,strength:1});else if(r.strength===1)r.strength=2;else S.relations=S.relations.filter(x=>x!==r);save();render()}

function kpiDetail(id){let k=kpi(id);if(!k)return;let months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let rows=months.map((m,i)=>`<tr><td><b>${m}</b></td><td>${k.targets[i]??'—'}</td><td>${k.values[i]??'—'}</td><td>${k.values[i]!=null&&k.targets[i]!=null?(k.values[i]-k.targets[i]).toFixed(1):'—'}</td><td>${k.values[i]!=null&&k.targets[i]!=null?badge(Math.abs(k.values[i]-k.targets[i])<=k.tolerance?'On track':'At risk'):'—'}</td></tr>`);
let pts=k.values.map((v,i)=>({v,t:k.targets[i]})),min=Math.min(...pts.flatMap(p=>[p.v,p.t]))-3,max=Math.max(...pts.flatMap(p=>[p.v,p.t]))+3;

function xm4Ancestors(g){

 const initiativeSupports=(g,i)=>i.goal===g.id||S.relations.some(r=>r.from===g.id&&r.to===i.id&&r.strength>0);
 if(type==='corp'){
  data.annual.filter(g=>belongs(g,id)).forEach(g=>marked.annual.add(g.id));
 }
 if(type==='annual'){
  data.annual.filter(g=>belongs(g,id)).forEach(g=>marked.annual.add(g.id));
 }
 if(type==='initiative'){
  data.annual.filter(g=>initiativeSupports(g,initiative(id)||{goal:''})).forEach(g=>marked.annual.add(g.id));
 }
 if(type==='kpi'){
  data.annual.filter(g=>g.kpi===id).forEach(g=>marked.annual.add(g.id));
  data.initiatives.filter(i=>xm3Impact(i.id,id)>0).forEach(i=>marked.initiative.add(i.id));
  data.annual.filter(g=>[...marked.initiative].some(iid=>initiativeSupports(g,initiative(iid)||{goal:''}))).forEach(g=>marked.annual.add(g.id));
 }
 if(type==='corp'||type==='annual'){
  data.initiatives.filter(i=>[...marked.annual].some(gid=>initiativeSupports(goal(gid)||{id:''},i))).forEach(i=>marked.initiative.add(i.id));
 }
 if(type==='initiative')marked.initiative.add(id);
 // Every goal has its proper upstream corporate ancestor, including Department → Site → Corporate.
 data.annual.filter(g=>marked.annual.has(g.id)).forEach(g=>{const root=xm4OrgParent(g);if(root)marked.corp.add(root.id)});
 data.kpis.filter(k=>[...marked.annual].some(gid=>goal(gid)?.kpi===k.id)||

  const arr=gm55ConsecutiveKpiStatus(k),lastStatus=arr.at(-1),prevStatus=arr.at(-2);
  if(lastStatus==='Off track'||lastStatus==='At risk'&&prevStatus==='At risk'){
   const reasons=lastStatus==='Off track'?'KPI is off track':'KPI has been at risk for two consecutive periods';
   out.push({key:'KPI:'+k.id,kind:'automatic',sourceType:'kpi',sourceId:k.id,title:k.name,
    issue:reasons,request:'Review the gap and decide whether support or corrective action is needed',
    status:lastStatus,priority:lastStatus==='Off track'?4:2});

 }
 for(const i of S.initiatives){if(i.status!=='At risk'||!gm55CanReadSource('initiative',i.id)||blocked.has('initiative:'+i.id))continue;
  out.push({key:'INIT:'+i.id,kind:'automatic',sourceType:'initiative',sourceId:i.id,title:i.title,
   issue:'Initiative is marked At risk',request:'Confirm blocker and agree the recovery action',status:'At risk',priority:2});

function gm56Finite(x){return x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));}
function gm56RangeFor(k,year,month){
 const b=k?.gmRangeByYear?.[year]||{};const lo=b.lower?.[month],hi=b.upper?.[month];
 return gm56Finite(lo)&&gm56Finite(hi)&&Number(lo)<=Number(hi)?[Number(lo),Number(hi)]:null;
}
function gm56Period(k,month,goalm=null){
 if(!k||month<0||month>11||!gm56Finite(k.values?.[month]))return {label:'Not measured',reason:'No actual'};
 const actual=Number(k.values[month]),tol=Math.max(0,Number(k.tolerance)||0);
 let target=null,gap=null,lo=null,hi=null;
 if(k.direction==='range'){
  const r=gm56RangeFor(k,String(S.year),month);
  if(!r)return {label:'Not measured',reason:'Range limits missing',actual};
  [lo,hi]=r;gap=actual<lo?actual-lo:actual>hi?hi-actual:0;
 }else{
  const t=goalm===null?k.targets?.[month]:goalm;
  if(!gm56Finite(t))return {label:'Not measured',reason:'No target',actual};
  target=Number(t);gap=k.direction==='lower'?target-actual:actual-target;
 }
 const label=gap>=0?'On track':gap>=-tol?'At risk':'Off track';
 return {label,actual,target,lower:lo,upper:hi,gap,tolerance:tol,month,year:String(S.year)};
}
function gm56Latest(k, goalData=null){
 if(!k)return {label:'Not measured',gap:null};
 for(let m=11;m>=0;m--){
   if(!gm56Finite(k.values?.[m]))continue;
   const plan=goalData?.gmMonthlyTargetByYear?.[String(S.year)];
   const gtarget=Array.isArray(plan)&&gm56Finite(plan[m])?plan[m]:null;
   const r=gm56Period(k,m,gtarget);
   if(r.label!=='Not measured')return r;
 }
 return {label:'Not measured',gap:null};
}

function gm56StageOrApplyGoalPlan(g,year,values){
 if(g.approval==='Pending')return {ok:false,reason:'This goal is already pending approval. Request changes before editing its target plan.'};
 if(g.approval==='Approved'){
  S.goalRevisions.push({goalId:g.id,at:today,approvedSnapshot:structuredClone(g),revision:g.revision||1,reason:'Proposed monthly KPI plan revision'});
  g.revision=(g.revision||1)+1;g.approval='Draft';
  if(!g.gmPendingMonthlyByYear)g.gmPendingMonthlyByYear={};g.gmPendingMonthlyByYear[year]=values;
  return {ok:true,staged:true};
 }
 if(g.gmPendingMonthlyByYear&&Object.hasOwn(g.gmPendingMonthlyByYear,year)){
  g.gmPendingMonthlyByYear[year]=values;return {ok:true,staged:true};
 }
 if(values===null)delete g.gmMonthlyTargetByYear[year];else g.gmMonthlyTargetByYear[year]=values;
 return {ok:true,staged:false};
}

// Use current selected strategy period for all CSV imports. All rows validate first.
csvRead=function(text){
 const lines=String(text||'').replace(/^\ufeff/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),errors=[],records=[];
 if(lines.length<2)return {errors:['Expected a header and at least one data row'],records};
 const delimiter=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';
 const heads=parseCsvLine(lines[0],delimiter).map(x=>x.toLowerCase().replace(/[\s-]+/g,'_'));
 for(const name of ['kpi_id','month','actual'])if(!heads.includes(name))errors.push('Missing column '+name);
 if(errors.length)return {errors,records};
 const seen=new Set(),year=String(S.year);
 for(let n=1;n<lines.length;n++){
  try{
   const cols=parseCsvLine(lines[n],delimiter),obj=Object.fromEntries(heads.map((h,j)=>[h,cols[j]??'']));
   if(!kpi(obj.kpi_id))throw new Error('Unknown KPI ID '+obj.kpi_id);
   let yy=year;if(/^\d{4}-/.test(obj.month))yy=obj.month.slice(0,4);
   if(yy!==year)throw new Error('Row year '+yy+' does not match the selected planning year '+year);
   const month=monthIndex(obj.month);if(month<0)throw new Error('Invalid month '+obj.month);
   const parseNum=v=>Number(delimiter===';'?String(v).replace(',','.'):v);
   if(!gm56Finite(obj.actual)||!Number.isFinite(parseNum(obj.actual)))throw new Error('Invalid actual value');
   if(obj.target!==''&&obj.target!==undefined&&(!gm56Finite(obj.target)||!Number.isFinite(parseNum(obj.target))))throw new Error('Invalid target value');
   const dedup=obj.kpi_id+':'+month;if(seen.has(dedup))throw new Error('Duplicate KPI/month in import');seen.add(dedup);
   records.push({key:obj.kpi_id,index:month,actual:parseNum(obj.actual),target:obj.target===''||obj.target===undefined?null:parseNum(obj.target),row:n+1});
  }catch(e){errors.push('Row '+(n+1)+': '+e.message)}
 }
 return {errors,records};
};
commitCsv=function(){

 for(const r of p.records){const k=kpi(r.key);while(k.values.length<=r.index)k.values.push(null);k.values[r.index]=r.actual;
  if(r.target!==null){while(k.targets.length<=r.index)k.targets.push(null);k.targets[r.index]=r.target;}
  k.source='Validated CSV import (local prototype)';k.sourceUpdated=today;
 }
 S.csvImports.push({date:today,year:String(S.year),count:p.records.length,source:'Validated CSV'});
 gm56Log('KpiImport',String(S.year),`Imported ${p.records.length} validated KPI observations`);
 syncGoalPerformance();save();go('kpis');toast('Validated KPI batch imported');
};
